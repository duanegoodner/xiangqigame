name: Mirror to GitLab
on:
  push:
    # Every branch, filtered below to the default one. A literal [main] meant
    # repos whose default is master (or anything else) never fired at all, so
    # their GitLab projects sat empty and nobody noticed. '**' also keeps tag
    # pushes from triggering this.
    branches: ['**']
concurrency:
  group: gitlab-mirror
  cancel-in-progress: true
jobs:
  mirror:
    # Mirror the default branch only, whatever it happens to be called.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Check for GitLab token
        run: |
          if [ -z "${{ secrets.GITLAB_MIRROR_TOKEN }}" ]; then
            echo "::error::GITLAB_MIRROR_TOKEN secret is not set"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Without this the runner has LFS pointers but not the objects, and
          # git-lfs rejects the push ("missing or corrupt local objects"), so
          # an LFS repo can never mirror. A no-op for repos that don't use LFS.
          lfs: true
      - name: Fetch all LFS objects
        # checkout's `lfs: true` only fetches objects reachable from the
        # checked-out ref, but we push the whole history, and git-lfs insists on
        # uploading every object that history references. One blob deleted from
        # HEAD long ago was enough to fail ehr_adversarial_attack's mirror
        # forever. --all covers every ref; it is a fast no-op without LFS.
        run: git lfs fetch --all origin
      - name: Push to GitLab
        run: |
          if [ "${{ github.repository_owner }}" = "duanegoodner" ]; then
            GITLAB_NS="duane.goodner"
          else
            GITLAB_NS="${{ github.repository_owner }}"
          fi
          REPO_NAME="${{ github.event.repository.name }}"
          URL="https://gitlab.com/${GITLAB_NS}/${REPO_NAME}.git"

          # GitLab returns transient 5xx (observed: 503). Without a retry, a
          # seconds-long outage fails the job and leaves the mirror stale until
          # the next push. Each attempt is bounded by `timeout` so a
          # hung connection falls through to the next attempt instead of
          # stalling the job.
          for attempt in 1 2 3 4 5; do
            if timeout 180 git \
                 -c credential.helper='!f() { echo "username=oauth2"; echo "password=${GITLAB_TOKEN}"; }; f' \
                 push --force "$URL" "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo "Mirrored on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              delay=$((attempt * 20))
              echo "::warning::push to GitLab failed (attempt ${attempt}/5), retrying in ${delay}s"
              sleep "${delay}"
            fi
          done
          echo "::error::push to GitLab failed after 5 attempts"
          exit 1
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
